<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IStock Shell UI - 打包测试页面</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <!-- 外部依赖 CDN -->
    <script type="importmap">
    {
        "imports": {
            "@antv/g2": "https://cdn.jsdelivr.net/npm/@antv/g2@5.3.3/dist/g2.min.js",
            "highlight.js": "https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/es/index.js",
            "marked": "https://cdn.jsdelivr.net/npm/marked@15.0.12/lib/marked.esm.js",
            "marked-highlight": "https://cdn.jsdelivr.net/npm/marked-highlight@2.2.1/src/index.js"
        }
    }
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .test-section {
            margin: 2rem 0;
            padding: 1.5rem;
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
            background: #f9fafb;
        }
        .test-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #374151;
        }
        .component-demo {
            margin: 1rem 0;
            padding: 1rem;
            background: white;
            border-radius: 0.375rem;
            border: 1px solid #d1d5db;
        }
    </style>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">IStock Shell UI</h1>
            <p class="text-lg text-gray-600">打包后组件测试页面</p>
        </header>

        <!-- 基础组件测试 -->
        <div class="test-section">
            <h2 class="test-title">🔘 基础组件测试</h2>
            
            <div class="component-demo">
                <h3 class="font-semibold mb-2">Button 按钮</h3>
                <div id="button-demo"></div>
            </div>

            <div class="component-demo">
                <h3 class="font-semibold mb-2">Input 输入框</h3>
                <div id="input-demo"></div>
            </div>

            <div class="component-demo">
                <h3 class="font-semibold mb-2">Alert 警告提示</h3>
                <div id="alert-demo"></div>
            </div>
        </div>

        <!-- 数据展示组件测试 -->
        <div class="test-section">
            <h2 class="test-title">📊 数据展示组件测试</h2>
            
            <div class="component-demo">
                <h3 class="font-semibold mb-2">Table 表格</h3>
                <div id="table-demo"></div>
            </div>

            <div class="component-demo">
                <h3 class="font-semibold mb-2">List 列表</h3>
                <div id="list-demo"></div>
            </div>
        </div>

        <!-- 扩展组件测试 -->
        <div class="test-section">
            <h2 class="test-title">🎨 扩展组件测试</h2>
            
            <div class="component-demo">
                <h3 class="font-semibold mb-2">Loading 加载状态</h3>
                <div id="loading-demo"></div>
            </div>

            <div class="component-demo">
                <h3 class="font-semibold mb-2">Icon 图标</h3>
                <div id="icon-demo"></div>
            </div>

            <div class="component-demo">
                <h3 class="font-semibold mb-2">Text 文本</h3>
                <div id="text-demo"></div>
            </div>
        </div>

        <!-- 测试结果 -->
        <div class="test-section">
            <h2 class="test-title">✅ 测试结果</h2>
            <div id="test-results" class="space-y-2">
                <p class="text-gray-600">正在加载组件...</p>
            </div>
        </div>
    </div>

    <!-- 引入打包后的组件库 -->
    <script type="module">
        // 测试结果记录
        const testResults = [];
        const resultsContainer = document.getElementById('test-results');

        function addTestResult(component, status, message) {
            testResults.push({ component, status, message });
            updateTestResults();
        }

        function updateTestResults() {
            resultsContainer.innerHTML = testResults.map(result => 
                `<div class="flex items-center space-x-2">
                    <span class="${result.status === 'success' ? 'text-green-600' : 'text-red-600'}">
                        ${result.status === 'success' ? '✅' : '❌'}
                    </span>
                    <span class="font-medium">${result.component}:</span>
                    <span class="text-gray-600">${result.message}</span>
                </div>`
            ).join('');
        }

        // 测试组件加载
        async function testComponents() {
            try {
                // 尝试导入主包
                const { 
                    ShButton, ShInput, ShAlert, ShTable, ShTableRow, ShTableTh, ShTableTd,
                    ShList, ShListRow, ShLoading, ShIcon, ShText
                } = await import('../dist/shell-ui.js');
                
                addTestResult('主包导入', 'success', '成功导入所有组件');

                // 测试 Button 组件
                try {
                    const buttonContainer = document.getElementById('button-demo');
                    const buttonElement = document.createElement('div');
                    buttonContainer.appendChild(buttonElement);
                    new ShButton({
                        target: buttonElement,
                        props: {
                            color: 'primary',
                            size: 'md'
                        }
                    });
                    buttonElement.textContent = '测试按钮';
                    addTestResult('Button', 'success', '组件渲染成功');
                } catch (error) {
                    addTestResult('Button', 'error', `渲染失败: ${error.message}`);
                }

                // 测试 Input 组件
                try {
                    const inputContainer = document.getElementById('input-demo');
                    new ShInput({
                        target: inputContainer,
                        props: {
                            placeholder: '请输入内容...',
                            value: '测试输入框'
                        }
                    });
                    addTestResult('Input', 'success', '组件渲染成功');
                } catch (error) {
                    addTestResult('Input', 'error', `渲染失败: ${error.message}`);
                }

                // 测试 Alert 组件
                try {
                    const alertContainer = document.getElementById('alert-demo');
                    new ShAlert({
                        target: alertContainer,
                        props: {
                            type: 'info',
                            description: '这是一个测试警告信息'
                        }
                    });
                    addTestResult('Alert', 'success', '组件渲染成功');
                } catch (error) {
                    addTestResult('Alert', 'error', `渲染失败: ${error.message}`);
                }

                // 测试 Loading 组件
                try {
                    const loadingContainer = document.getElementById('loading-demo');
                    new ShLoading({
                        target: loadingContainer,
                        props: {
                            size: 'md'
                        }
                    });
                    addTestResult('Loading', 'success', '组件渲染成功');
                } catch (error) {
                    addTestResult('Loading', 'error', `渲染失败: ${error.message}`);
                }

                // 测试 Text 组件
                try {
                    const textContainer = document.getElementById('text-demo');
                    new ShText({
                        target: textContainer,
                        props: {
                            content: '这是一个测试文本组件，支持多种样式和截断功能。'
                        }
                    });
                    addTestResult('Text', 'success', '组件渲染成功');
                } catch (error) {
                    addTestResult('Text', 'error', `渲染失败: ${error.message}`);
                }

                // 测试 Table 组件
                try {
                    const tableContainer = document.getElementById('table-demo');
                    new ShTable({
                        target: tableContainer,
                        props: {
                            thead: [{ title: '姓名' }, { title: '年龄' }, { title: '城市' }],
                            tbody: [
                                { data: ['张三', '25', '北京'] },
                                { data: ['李四', '30', '上海'] },
                                { data: ['王五', '28', '广州'] }
                            ]
                        }
                    });
                    
                    addTestResult('Table', 'success', '组件渲染成功');
                } catch (error) {
                    addTestResult('Table', 'error', `渲染失败: ${error.message}`);
                }

                // 测试 List 组件
                try {
                    const listContainer = document.getElementById('list-demo');
                    new ShList({
                        target: listContainer,
                        props: {
                            data: [
                                { title: '列表项 1', description: '这是第一个列表项' },
                                { title: '列表项 2', description: '这是第二个列表项' },
                                { title: '列表项 3', description: '这是第三个列表项' }
                            ]
                        }
                    });
                    addTestResult('List', 'success', '组件渲染成功');
                } catch (error) {
                    addTestResult('List', 'error', `渲染失败: ${error.message}`);
                }

            } catch (error) {
                addTestResult('主包导入', 'error', `导入失败: ${error.message}`);
                console.error('组件导入失败:', error);
            }
        }

        // 页面加载完成后开始测试
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(testComponents, 100);
        });
    </script>
</body>
</html>
