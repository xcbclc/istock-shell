<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <!-- 背景圆形 -->
  <circle cx="32" cy="32" r="30" fill="#f26522" fill-opacity="0.1" stroke="#f26522" stroke-width="2"/>
  
  <!-- 大脑/神经网络图案 -->
  <g transform="translate(16, 16)">
    <!-- 中心节点 -->
    <circle cx="16" cy="16" r="3" fill="#f26522"/>
    
    <!-- 周围节点 -->
    <circle cx="8" cy="8" r="2" fill="#f26522" fill-opacity="0.8"/>
    <circle cx="24" cy="8" r="2" fill="#f26522" fill-opacity="0.8"/>
    <circle cx="8" cy="24" r="2" fill="#f26522" fill-opacity="0.8"/>
    <circle cx="24" cy="24" r="2" fill="#f26522" fill-opacity="0.8"/>
    <circle cx="4" cy="16" r="1.5" fill="#f26522" fill-opacity="0.6"/>
    <circle cx="28" cy="16" r="1.5" fill="#f26522" fill-opacity="0.6"/>
    <circle cx="16" cy="4" r="1.5" fill="#f26522" fill-opacity="0.6"/>
    <circle cx="16" cy="28" r="1.5" fill="#f26522" fill-opacity="0.6"/>
    
    <!-- 连接线 -->
    <line x1="16" y1="16" x2="8" y2="8" stroke="#f26522" stroke-width="1.5" stroke-opacity="0.7"/>
    <line x1="16" y1="16" x2="24" y2="8" stroke="#f26522" stroke-width="1.5" stroke-opacity="0.7"/>
    <line x1="16" y1="16" x2="8" y2="24" stroke="#f26522" stroke-width="1.5" stroke-opacity="0.7"/>
    <line x1="16" y1="16" x2="24" y2="24" stroke="#f26522" stroke-width="1.5" stroke-opacity="0.7"/>
    <line x1="16" y1="16" x2="4" y2="16" stroke="#f26522" stroke-width="1" stroke-opacity="0.5"/>
    <line x1="16" y1="16" x2="28" y2="16" stroke="#f26522" stroke-width="1" stroke-opacity="0.5"/>
    <line x1="16" y1="16" x2="16" y2="4" stroke="#f26522" stroke-width="1" stroke-opacity="0.5"/>
    <line x1="16" y1="16" x2="16" y2="28" stroke="#f26522" stroke-width="1" stroke-opacity="0.5"/>
    
    <!-- 数据流动效果 -->
    <circle cx="12" cy="12" r="0.8" fill="#4f46e5">
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="20" cy="12" r="0.8" fill="#4f46e5">
      <animate attributeName="opacity" values="0;1;0" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="12" cy="20" r="0.8" fill="#4f46e5">
      <animate attributeName="opacity" values="0;1;0" dur="2s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="20" cy="20" r="0.8" fill="#4f46e5">
      <animate attributeName="opacity" values="0;1;0" dur="2s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- AI标识 -->
  <text x="32" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#f26522">AI</text>
</svg>